<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tatuaże</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<header class="naglowek1">
    <img src="logo.png" alt="salon">
</header>

<header class="naglowek2">
    <h1>Studio Tatuażu</h1>
</header>

<aside>
    <h3>Dodaj wzór</h3>

    <label for="wzor">Wzór:</label>
    <input type="text" id="wzor" name="wzor">

    <input type="file" id="plik" name="plik" accept="image/png">

    <label for="kolor">Kolor:</label>
    <select id="kolor" name="kolor">
        <option value="Czarny">Czarny</option>
        <option value="Czerwony">Czerwony</option>
        <option value="Zielony">Zielony</option>
        <option value="Niebieski">Niebieski</option>
    </select>

    <label for="cena">Cena:</label>
    <input type="number" id="cena" name="cena">

    <button type="button" id="dodaj">Dodaj Wzór</button>
</aside>

<section id="galeria">
    <h2>Galeria</h2>
    <img src="smok.png" alt="smok.png" class="miniatury">
    <img src="koliber.png" alt="koliber.png" class="miniatury">
</section>

<footer>
    <p>Autor strony: Wilson</p>
</footer>

<script src="script.js"></script>
</body>
</html>
